name: Signing setup

# Run once (and again only when App IDs/capabilities change).
# Creates the distribution certificate + App Store profile and stores them
# encrypted on the `match-signing` branch of this repo.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate profiles (needed after adding capabilities)'
        type: boolean
        default: false
      runner:
        description: 'Mac runner (switch if one type is not available)'
        required: false
        default: 'macos-15-intel'
        type: choice
        options: ['macos-15-intel', 'macos-26', 'macos-15', 'macos-26-intel']

permissions:
  contents: write

jobs:
  setup:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_IDS: com.jondhale.thirdeye,com.jondhale.thirdeye.live
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets are set
        run: |
          missing=0
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error title=secrets::Missing secret for $v (see docs/RUNBOOK.md)"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then echo "::error title=secrets::Missing secret ASC_KEY_P8_BASE64"; missing=1; fi
          exit $missing

      - name: Prepare credentials (runner only)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          PW=$(printf '%s' "${{ secrets.ASC_KEY_P8_BASE64 }}" | shasum -a 256 | cut -d' ' -f1)
          echo "::add-mask::$PW"
          echo "MATCH_PASSWORD=$PW" >> "$GITHUB_ENV"
          AUTH=$(printf 'x-access-token:%s' "${{ github.token }}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_AUTH=$AUTH" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: command -v fastlane >/dev/null || sudo gem install fastlane --no-document

      - name: Create certificate and profile
        env:
          MATCH_FORCE: ${{ inputs.force }}
        run: |
          set +e
          fastlane signing_setup > "$RUNNER_TEMP/fastlane.log" 2>&1
          status=$?
          set -e
          tail -80 "$RUNNER_TEMP/fastlane.log"
          grep -E "✔|Successfully|Data Protection|Registering|Installed|profile" "$RUNNER_TEMP/fastlane.log" | tail -8 | cut -c1-600 \
            | while IFS= read -r line; do echo "::notice title=signing::$line"; done
          if [ $status -ne 0 ]; then
            grep -iE "error|fail|maximum|limit|not found|invalid|denied|\[!\]" "$RUNNER_TEMP/fastlane.log" | tail -10 | cut -c1-900 \
              | while IFS= read -r line; do echo "::error title=signing::$line"; done
            exit $status
          fi

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
