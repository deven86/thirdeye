name: Monthly TestFlight rebuild

# TestFlight builds expire after 90 days. Re-upload on the 1st of every month
# so a usable build is always on the iPhone and iPad.
on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC = 08:47 IST on the 1st
  workflow_dispatch:

jobs:
  rebuild:
    uses: ./.github/workflows/ios-testflight.yml
    secrets: inherit
