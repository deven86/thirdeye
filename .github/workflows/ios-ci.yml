name: iOS build & test

# Compiles and runs unit tests on a simulator. Needs no secrets.
# Private repo: Mac minutes are limited, so (like VISION) this runs only by hand or on a PR.
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac runner (switch to macos-26 if Intel Macs are not available)'
        required: false
        default: 'macos-15-intel'
        type: choice
        options: ['macos-15-intel', 'macos-26']

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=xcode::No Xcode 26 installed on this runner image"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=selected::$(xcodebuild -version | tr '\n' ' ')"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS-26" not in rt: continue
              for x in devs:
                  if x["name"].startswith("iPhone"): best=x["udid"]
          print(best or "")')
          if [ -z "$UDID" ]; then
            echo "::warning title=simulator::No iOS 26 iPhone simulator on this image; downloading the iOS platform"
            xcodebuild -downloadPlatform iOS
            RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["identifier"].find("iOS-26")>=0 and x["isAvailable"]]; print(r[-1]["identifier"] if r else "")')
            test -n "$RT" || { echo "::error title=simulator::No iOS 26 runtime available"; exit 1; }
            UDID=$(xcrun simctl create "CI iPhone" "iPhone 17" "$RT" 2>/dev/null || xcrun simctl create "CI iPhone" "iPhone 16" "$RT")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/ThirdEye.xcodeproj \
            -scheme ThirdEye \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/TestResults.xcresult \
            | tee build.log | grep -E "error:|warning: .*concurren|Test .*(passed|failed)|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build.log
            build/TestResults.xcresult
          retention-days: 7
