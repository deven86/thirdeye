name: iOS build & test

# Compiles and runs unit tests on a simulator. Needs no secrets, so it works
# before any Apple accounts are set up.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS-26" not in rt: continue
              for x in devs:
                  if x["name"].startswith("iPhone"): best=x["udid"]
          print(best or "")')
          test -n "$UDID" || { echo "No iOS 26 iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Score1000.xcodeproj \
            -scheme Score1000 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/TestResults.xcresult \
            | tee build.log | grep -E "error:|warning: .*concurren|Test .*(passed|failed)|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build.log
            build/TestResults.xcresult
          retention-days: 7
