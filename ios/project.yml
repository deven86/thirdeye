name: ThirdEye
options:
  bundleIdPrefix: com.jondhale
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ""  # passed in by CI from the APPLE_TEAM_ID secret
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ThirdEye:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: ThirdEye
    info:
      path: ThirdEye/Info.plist
      properties:
        CFBundleDisplayName: Third Eye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Third Eye uses Face ID to keep your trades, keys and analysis private.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ThirdEye/ThirdEye.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.thirdeye
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.thirdeye"

  ThirdEyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThirdEyeTests
    dependencies:
      - target: ThirdEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.thirdeye.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ThirdEye:
    build:
      targets:
        ThirdEye: all
        ThirdEyeTests: [test]
    test:
      targets:
        - ThirdEyeTests
