name: ThirdEye
options:
  bundleIdPrefix: com.jondhale
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.12.2"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ""  # passed in by CI from the APPLE_TEAM_ID secret
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ThirdEye:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: ThirdEye
      - path: Shared
    dependencies:
      - target: ThirdEyeLive
    info:
      path: ThirdEye/Info.plist
      properties:
        CFBundleDisplayName: Third Eye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Third Eye uses Face ID to keep your trades, keys and analysis private.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jondhale.thirdeye
            CFBundleURLSchemes: [thirdeye]
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ThirdEye/ThirdEye.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: production
        com.apple.developer.usernotifications.time-sensitive: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jondhale.thirdeye
          - $(AppIdentifierPrefix)com.jondhale.thirdeye.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.thirdeye
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.thirdeye"

  ThirdEyeLive:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: ThirdEyeLive
      - path: Shared
    info:
      path: ThirdEyeLive/Info.plist
      properties:
        CFBundleDisplayName: Third Eye Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ThirdEyeLive/ThirdEyeLive.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jondhale.thirdeye.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.thirdeye.live
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.thirdeye.live"

  ThirdEyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThirdEyeTests
      # The widget's views, compiled in too so the design snapshot test can render them.
      - path: ThirdEyeLive/TradeBox.swift
      - path: ThirdEyeLive/TradesWidget.swift
      - path: ThirdEyeLive/TradeLiveActivity.swift
    dependencies:
      - target: ThirdEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.thirdeye.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ThirdEye:
    build:
      targets:
        ThirdEye: all
        ThirdEyeTests: [test]
    test:
      targets:
        - ThirdEyeTests
